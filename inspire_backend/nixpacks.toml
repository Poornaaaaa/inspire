[phases.setup]
nixPkgs = ["python311", "gcc"]

[phases.install]
cmds = ["python -m pip install -r requirements.txt"]

[phases.build]
cmds = ["python manage.py collectstatic --no-input"]

[start]
cmd = "python manage.py migrate && python manage.py seed_inspire_data && gunicorn inspire_project.wsgi --bind 0.0.0.0:$PORT"
